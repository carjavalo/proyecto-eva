<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/eva-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVA - Sistema de Gestión de Equipos</title>
    
    <!-- Tipografías de la pantalla de inicio (Public Sans + Barlow Condensed) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700;800&display=swap" />

    <!-- Configuración dinámica para Docker -->
    <script src="/config.js" defer></script>
    
    <!-- Meta tags para SEO y redes sociales -->
    <meta name="description" content="Sistema EVA - Gestión de Equipos Médicos del Hospital Universitario del Valle" />
    <meta name="keywords" content="EVA, equipos médicos, hospital, gestión, mantenimiento" />
    <meta name="author" content="Hospital Universitario del Valle" />
    
    <!-- Meta tags para PWA -->
    <meta name="theme-color" content="#70bbd9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EVA Sistema" />
    
    <!-- Preload critical resources -->
    <link rel="preload" href="/config.js" as="script" />
    <script type="module" crossorigin src="/js/index-x7MOXe1T.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CguNruhA.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- Loading screen con imagen del doctor -->
    <div id="app-loading" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #dbeafe 0%, #ffffff 50%, #dbeafe 100%); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;">
      <div style="position: relative; display: flex; flex-direction: column; align-items: center;">
        <!-- Imagen del doctor con animación -->
        <div style="position: relative; margin-bottom: 32px; animation: float 3s ease-in-out infinite;">
          <img src="/images/loadingavatars.png" alt="Doctor" style="width: 600px; height: 550px; object-fit: contain; filter: drop-shadow(0 25px 25px rgba(0, 0, 0, 0.15));" />
          <!-- Efecto de brillo -->
          <div style="position: absolute; z-index: -1; inset: 0; background: #60a5fa; border-radius: 50%; filter: blur(60px); opacity: 0.2; animation: pulse 2s ease-in-out infinite;"></div>
        </div>

        <!-- Spinner mejorado -->
        <div style="position: relative; width: 64px; height: 64px;">
          <!-- Anillo exterior -->
          <!-- <div style="position: absolute; inset: 0; border: 4px solid #93c5fd; border-radius: 50%; animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite; opacity: 0.75;"></div> -->
          <!-- Spinner principal -->
          <!-- <div style=" margin-top: 100px;width: 64px; height: 64px; border: 4px solid #3b82f6; border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite;"></div> -->
          <!-- Punto central -->
          <!-- <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 12px; height: 12px; background: #3b82f6; border-radius: 50%; animation: pulse 1.5s ease-in-out infinite;"></div> -->
        </div>

        <!-- Puntos decorativos -->
        <!-- <div style="position: absolute; top: 75%; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; margin-top: 16px;">
          <div style="width: 8px; height: 8px; background: #3b82f6; border-radius: 50%; animation: bounce 1s ease-in-out infinite;"></div>r. 
          <div style="width: 8px; height: 8px; background: #3b82f6; border-radius: 50%; animation: bounce 1s ease-in-out 0.15s infinite;"></div>
          <div style="width: 8px; height: 8px; background: #3b82f6; border-radius: 50%; animation: bounce 1s ease-in-out 0.3s infinite;"></div>
        </div> -->
      </div>

      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes float {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-20px); }
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.5; }
        }
        @keyframes ping {
          75%, 100% { transform: scale(1.2); opacity: 0; }
        }
        @keyframes bounce {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-10px); }
        }
        @keyframes fadeOut {
          0% { opacity: 1; transform: scale(1); }
          100% { opacity: 0; transform: scale(1.05); }
        }
        .loading-fade-out {
          animation: fadeOut 0.8s ease-out forwards;
        }
        #root {
          animation: fadeIn 0.8s ease-in;
        }
        @keyframes fadeIn {
          0% { opacity: 0; transform: translateY(20px); }
          100% { opacity: 1; transform: translateY(0); }
        }
      </style>
    </div>


    <!-- Script para manejar loading screen -->
    <script>
      // Mostrar loading siempre
      document.getElementById('app-loading').style.display = 'flex';
      
      // Ocultar loading cuando la app esté lista con animación suave
      window.addEventListener('load', function() {
        setTimeout(() => {
          const loading = document.getElementById('app-loading');
          if (loading) {
            // Agregar clase de fade-out
            loading.classList.add('loading-fade-out');
            // Esperar a que termine la animación antes de ocultar
            setTimeout(() => {
              loading.style.display = 'none';
            }, 800); // Coincide con la duración de la animación
          }
        }, 2000); // Aumentado a 2 segundos antes de iniciar fade-out
      });
      
      // Debug info para desarrollo
      if (window.location.hostname === 'localhost') {
        console.log('🔧 EVA Frontend - Modo desarrollo local');
      } else {
        console.log('🐳 EVA Frontend - Modo Docker en red');
        console.log('Host detectado:', window.location.hostname);
      }
    </script>
  </body>
</html>
